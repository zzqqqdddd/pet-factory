[package]
name = "pet_factory"
version = "1.0.0"
description = "A standalone desktop pet application built from hatch-pet resources"
authors = ["Pet Factory"]
edition = "2021"

[lib]
name = "pet_factory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
